<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In · Contract Management System</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-900:#0f1c3f;
    --navy-800:#16244d;
    --navy-700:#1d3374;
    --navy-600:#294393;
    --red-600:#c1272d;
    --slate-500:#64748b;
    --slate-600:#4b5768;
    --slate-800:#26324a;
    --grey-100:#f2f4f8;
    --grey-200:#e4e8ef;
    --focus:#2f4fa0;
  }

  *{ margin:0; padding:0; box-sizing:border-box; }

  body{
    font-family:'Inter', sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 20px;
    background:
      radial-gradient(900px 500px at 20% 0%, rgba(255,255,255,0.12), transparent 60%),
      linear-gradient(160deg, #5c7ab8 0%, #2c407e 42%, var(--navy-900) 100%);
    position:relative;
    overflow:hidden;
  }

  body::before{
    content:"";
    position:absolute;
    inset:0;
    background-image:
      linear-gradient(rgba(255,255,255,0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.035) 1px, transparent 1px);
    background-size:36px 36px;
    pointer-events:none;
  }

  .login-card{
    position:relative;
    width:100%;
    max-width:440px;
    background:#ffffff;
    border-radius:18px;
    padding:0 0 44px;
    overflow:hidden;
    box-shadow:
      0 30px 70px -24px rgba(6,12,30,0.5),
      0 1px 0 rgba(255,255,255,0.6) inset;
    opacity:0;
    transform:translateY(14px);
    animation: rise 0.55s cubic-bezier(.2,.7,.2,1) forwards;
  }

  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){
    .login-card{ animation:none; opacity:1; transform:none; }
  }

  .card-accent{
    height:5px;
    width:100%;
    background:linear-gradient(90deg, var(--navy-700) 0%, var(--navy-700) 60%, var(--red-600) 100%);
  }

  .card-body{ padding:40px 44px 0; }

  .brand{
    display:flex;
    justify-content:center;
    margin-bottom:22px;
  }
  .brand img{
    height:46px;
    width:auto;
    mix-blend-mode:multiply;
  }

  .heading{
    text-align:center;
    margin-bottom:32px;
  }

  .heading h1{
    font-family:'Source Serif 4', serif;
    color:var(--navy-900);
    font-size:23px;
    font-weight:700;
    letter-spacing:-0.1px;
    margin-bottom:8px;
  }

  .heading p{
    color:var(--slate-500);
    font-size:14px;
    line-height:1.5;
  }

  .input-group{ margin-bottom:20px; }

  .input-group label{
    display:block;
    margin-bottom:8px;
    color:var(--slate-800);
    font-size:13px;
    font-weight:600;
  }

  .input-wrapper{
    position:relative;
    display:flex;
    align-items:center;
  }

  .input-icon{
    position:absolute;
    left:4px;
    width:36px;
    height:36px;
    border-radius:50%;
    background:var(--navy-700);
    display:flex;
    align-items:center;
    justify-content:center;
    color:#fff;
    pointer-events:none;
  }
  .input-icon svg{ width:16px; height:16px; }

  .input-wrapper input{
    width:100%;
    padding:14px 16px 14px 50px;
    border:1.5px solid var(--grey-200);
    border-radius:12px;
    background-color:var(--grey-100);
    font-family:inherit;
    font-size:14.5px;
    font-weight:600;
    color:var(--navy-900);
    outline:none;
    transition:border-color .15s ease, background-color .15s ease, box-shadow .15s ease;
  }

  .input-wrapper input::placeholder{
    color:#9aa4b5;
    font-weight:500;
  }

  .input-wrapper input:hover{ background-color:#eaeef4; }

  .input-wrapper input:focus{
    background-color:#fff;
    border-color:var(--focus);
    box-shadow:0 0 0 4px rgba(47,79,160,0.14);
  }

  .input-wrapper input:invalid:not(:placeholder-shown):not(:focus){
    border-color:var(--red-600);
  }

  .toggle-visibility{
    position:absolute;
    right:6px;
    width:32px;
    height:32px;
    border:none;
    background:transparent;
    color:var(--slate-500);
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    transition:background-color .15s ease, color .15s ease;
  }
  .toggle-visibility:hover{ background-color:var(--grey-200); color:var(--navy-800); }
  .toggle-visibility svg{ width:18px; height:18px; }

  .form-meta{
    display:flex;
    justify-content:flex-end;
    margin:-6px 0 28px;
  }
  .form-meta a{
    font-size:12.5px;
    color:var(--focus);
    text-decoration:none;
    font-weight:600;
  }
  .form-meta a:hover{ text-decoration:underline; }

  .login-btn{
    width:100%;
    padding:15px;
    background:linear-gradient(180deg, var(--navy-600), var(--navy-900));
    color:#fff;
    border:none;
    border-radius:12px;
    font-size:15px;
    font-weight:700;
    letter-spacing:0.2px;
    cursor:pointer;
    box-shadow:0 10px 20px -8px rgba(16,26,53,0.55);
    transition:transform .12s ease, box-shadow .12s ease, background .2s ease;
  }
  .login-btn:hover{
    box-shadow:0 12px 24px -8px rgba(16,26,53,0.6);
    background:linear-gradient(180deg, #2f4aa0, var(--navy-900));
  }
  .login-btn:active{ transform:translateY(1px); }
  .login-btn:focus-visible{
    outline:none;
    box-shadow:0 0 0 4px rgba(47,79,160,0.3), 0 10px 20px -8px rgba(16,26,53,0.55);
  }

  .login-btn.shake{ animation: shake .35s ease; }
  @keyframes shake{
    25%{ transform:translateX(-5px); }
    75%{ transform:translateX(5px); }
  }

  .security-note{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    margin-top:24px;
    color:var(--slate-500);
    font-size:11.5px;
  }
  .security-note svg{ width:13px; height:13px; flex-shrink:0; }

  @media (max-width:480px){
    .card-body{ padding:34px 26px 0; }
    .login-card{ padding-bottom:34px; }
    .heading h1{ font-size:21px; }
  }
</style>
</head>
<body>

  <div class="login-card">
    <div class="card-accent"></div>

    <div class="card-body">
      <div class="brand">
        <img src="logo.png" alt="Global IME Bank">
      </div>

      <div class="heading">
        <h1>Contract Management System</h1>
        <p>Sign in to access your contract records.</p>
      </div>

      <form id="loginForm" novalidate>

        <div class="input-group">
          <label for="adminId">Admin ID</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Z" stroke="currentColor" stroke-width="1.8"/>
                <path d="M4 20c1.5-3.8 4.8-6 8-6s6.5 2.2 8 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            <input type="text" id="adminId" name="adminId" placeholder="Enter your Admin ID" autocomplete="username" required>
          </div>
        </div>

        <div class="input-group">
          <label for="password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M8 10.5V8a4 4 0 1 1 8 0v2.5" stroke="currentColor" stroke-width="1.8"/>
              </svg>
            </span>
            <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="toggle-visibility" id="toggleBtn" aria-label="Show password" aria-pressed="false">
              <svg id="eyeIcon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.8"/>
                <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>
              </svg>
            </button>
          </div>
        </div>

        <div class="form-meta">
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">Log in</button>
      </form>

      <div class="security-note">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="5" y="10.5" width="14" height="9.5" rx="2" stroke="currentColor" stroke-width="1.8"/>
          <path d="M8 10.5V8a4 4 0 1 1 8 0v2.5" stroke="currentColor" stroke-width="1.8"/>
        </svg>
        <span>Your connection to this portal is encrypted</span>
      </div>
    </div>
  </div>

<script>
  const toggleBtn = document.getElementById('toggleBtn');
  const passwordInput = document.getElementById('password');
  const eyeIcon = document.getElementById('eyeIcon');

  toggleBtn.addEventListener('click', () => {
    const isPassword = passwordInput.type === 'password';
    passwordInput.type = isPassword ? 'text' : 'password';
    toggleBtn.setAttribute('aria-pressed', String(isPassword));
    toggleBtn.setAttribute('aria-label', isPassword ? 'Hide password' : 'Show password');
    eyeIcon.innerHTML = isPassword
      ? '<path d="M3 3l18 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M10.6 5.2A10.6 10.6 0 0 1 12 5c6.5 0 10 7 10 7a15.6 15.6 0 0 1-3.4 4.3M6.8 6.8C4.3 8.5 2 12 2 12s3.5 7 10 7c1.4 0 2.7-.3 3.9-.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.8"/>'
      : '<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8"/>';
  });

  const form = document.getElementById('loginForm');
  const loginBtn = document.getElementById('loginBtn');

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    if (!form.checkValidity()) {
      loginBtn.classList.remove('shake');
      void loginBtn.offsetWidth;
      loginBtn.classList.add('shake');
      form.reportValidity();
      return;
    }
    window.location.href = '/';
  });
</script>

</body>
</html>
