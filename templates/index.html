<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contract Management System</title>
    <!-- Importing Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { display: flex; height: 100vh; background-color: #f4f7fa; }

        /* --- SIDEBAR STYLING --- */
        .sidebar {
            width: 250px; background-color: #1a1e3c; color: white;
            display: flex; flex-direction: column; padding: 20px 0;
        }
        .logo-area { 
            padding: 0 20px 30px; 
            border-bottom: 1px solid rgba(255,255,255,0.1); 
            display: flex; align-items: center; gap: 10px;
        }
        .logo-placeholder { width: 40px; height: 40px; background: #e74c3c; border-radius: 50%; } /* Replace with actual logo image later */
        .logo-text { font-size: 14px; font-weight: bold; }
        
        .menu-label { padding: 20px 20px 10px; font-size: 12px; color: #8c92ac; font-weight: 600; }
        
        .nav-link {
            padding: 15px 20px; color: #ffffff; text-decoration: none;
            font-size: 15px; display: flex; align-items: center; gap: 10px;
            transition: background 0.2s;
        }
        .nav-link:hover, .nav-link.active { background-color: #2a2f54; border-left: 4px solid #3b82f6; }

        .logout-btn {
            margin-top: auto; margin-left: 20px; margin-right: 20px;
            padding: 10px; background: transparent; border: 1px solid #5a6080;
            color: white; border-radius: 5px; cursor: pointer;
        }

        /* --- MAIN CONTENT STYLING --- */
        .main-content { flex: 1; padding: 30px 40px; overflow-y: auto; }
        h1 { color: #e74c3c; font-size: 24px; margin-bottom: 30px; } /* Red title like the design */
        
        .dashboard-title { color: #3b82f6; font-size: 14px; font-weight: 600; margin-bottom: 15px; text-transform: uppercase;}

        /* --- STAT CARDS --- */
        .stats-grid { display: flex; gap: 20px; margin-bottom: 30px; }
        .stat-card {
            background: white; padding: 20px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); flex: 1;
            border: 1px solid #e2e8f0;
        }
        .stat-card h3 { color: #64748b; font-size: 13px; margin-bottom: 10px; }
        .stat-card p { font-size: 28px; font-weight: bold; color: #333; }
        .stat-card p.active-text { color: #22c55e; }  /* Green */
        .stat-card p.expiring-text { color: #f59e0b; } /* Orange */
        .stat-card p.expired-text { color: #ef4444; }  /* Red */

        /* --- TABLES --- */
        .table-container {
            background: white; padding: 20px; border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05); margin-bottom: 30px;
            border: 1px solid #e2e8f0;
        }
        .table-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .table-header h2 { font-size: 16px; color: #1e293b; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px 10px; text-align: left; border-bottom: 1px solid #e2e8f0; font-size: 14px; }
        th { color: #64748b; font-weight: 600; }
        tr:last-child td { border-bottom: none; }

        /* --- BUTTONS --- */
        .btn-primary {
            background-color: #1a1e3c; color: white; border: none;
            padding: 10px 20px; border-radius: 5px; font-size: 13px; cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar">
        <div class="logo-area">
            <div class="logo-placeholder"></div>
            <div class="logo-text">Global IME Bank</div>
        </div>
        <div class="menu-label">MAIN</div>
        <a href="/" class="nav-link active">Dashboard</a>
        <a href="#" class="nav-link">Contract</a>
        <a href="#" class="nav-link">Add Contract</a>
        <a href="#" class="nav-link">Documents</a>
        <a href="#" class="nav-link">History</a>
        <a href="#" class="nav-link">User (Admin)</a>
        <button class="logout-btn">Logout</button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <h1>Contract Management System</h1>
        
        <div class="dashboard-title">Dashboard</div>

        <!-- Stat Cards -->
        <div class="stats-grid">
            <div class="stat-card"><h3>Total</h3><p id="statTotal">0</p></div>
            <div class="stat-card"><h3>Active</h3><p id="statActive" class="active-text">0</p></div>
            <div class="stat-card"><h3>Expiring</h3><p id="statExpiring" class="expiring-text">0</p></div>
            <div class="stat-card"><h3>Expired</h3><p id="statExpired" class="expired-text">0</p></div>
        </div>

        <!-- Contracts Table -->
        <div class="table-container">
            <div class="table-header">
                <h2>Recent Contract</h2>
                <button class="btn-primary">+ Add Contract</button>
            </div>
            <table id="contractsTable">
                <thead>
                    <tr><th>ID</th><th>Contract</th><th>Vendor</th><th>Status</th></tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <!-- JavaScript to Fetch Data -->
    <script>
        fetch('/api/contracts')
            .then(res => res.json())
            .then(data => {
                const table = document.querySelector('#contractsTable tbody');
                
                // Count statuses for the cards
                let total = data.length;
                let active = 0, expiring = 0, expired = 0;

                data.forEach(c => {
                    // Fill table
                    table.innerHTML += `<tr>
                        <td>CNT00${c.id}</td>
                        <td>${c.name}</td>
                        <td>${c.vendor}</td>
                        <td>${c.status}</td>
                    </tr>`;

                    // Count logic
                    if(c.status === 'Active') active++;
                    if(c.status === 'Expiring') expiring++;
                    if(c.status === 'Expired') expired++;
                });

                // Update the numbers on the cards
                document.getElementById('statTotal').innerText = total;
                document.getElementById('statActive').innerText = active;
                document.getElementById('statExpiring').innerText = expiring;
                document.getElementById('statExpired').innerText = expired;
            });
    </script>

</body>
</html>
